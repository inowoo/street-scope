<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STREET SCOPE</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#game{width:100%;height:100%;display:block;outline:0}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000;user-select:none}.tl,.tr{position:absolute;top:14px;font-size:18px;font-weight:800;line-height:1.5}.tl{left:18px}.tr{right:18px;text-align:right}#cross{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff}.xv{left:13px;top:1px;width:2px;height:26px}.xh{left:1px;top:13px;width:26px;height:2px}#scope{display:none;position:absolute;inset:0}.mask{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0 31vmin,rgba(0,0,0,.97) 31.5vmin 100%)}.ring{position:absolute;left:50%;top:50%;width:62vmin;height:62vmin;transform:translate(-50%,-50%);border:2px solid #111;border-radius:50%}.sv,.sh{position:absolute;left:50%;top:50%;background:#111;transform:translate(-50%,-50%)}.sv{width:1px;height:56vmin}.sh{width:56vmin;height:1px}#zoom{position:absolute;left:50%;top:calc(50% + 34vmin);transform:translateX(-50%);font:700 13px monospace}#hit{display:none;position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%) rotate(45deg)}#hit:before,#hit:after{content:"";position:absolute;background:#fff}#hit:before{left:12px;width:2px;height:26px}#hit:after{top:12px;width:26px;height:2px}#msg{position:absolute;left:50%;top:31%;transform:translateX(-50%);font-size:20px;font-weight:900;opacity:0}#reload{display:none;position:absolute;left:50%;top:63%;transform:translateX(-50%);width:220px;height:6px;border:1px solid #fff}#reload>div{height:100%;width:0;background:#fff}#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;white-space:nowrap}#start{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(10,14,18,.82)}#panel{width:min(580px,calc(100vw - 50px));padding:28px;border:1px solid #ffffff33;border-radius:12px;background:#151a20e8}h1{margin:0 0 10px}p{line-height:1.6;color:#ddd}button{padding:10px 22px;font-size:16px;font-weight:800;border:0;border-radius:7px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="tl">SCORE <span id="score">0</span><br>HIT <span id="hits">0</span></div><div class="tr">AMMO <span id="ammo">5 / 5</span><br><span id="state">READY</span></div><div id="cross"><i class="xv"></i><i class="xh"></i></div><div id="scope"><div class="ring"></div><div class="sv"></div><div class="sh"></div><div id="zoom">4.0x</div><div class="mask"></div></div><div id="hit"></div><div id="msg"></div><div id="reload"><div></div></div><div id="hint">マウス:照準　右クリック長押し:スコープ　ホイール:倍率　左クリック:射撃　R:リロード　Esc:マウス解除</div></div>
<div id="start"><div id="panel"><h1>STREET SCOPE</h1><p>街路を見下ろす位置から、歩行者・車・箱・看板を狙う3Dスナイパー試作です。風や重力などの複雑な弾道計算はありません。</p><p>右クリック長押しでスコープ、ホイールで2〜8倍、左クリックで射撃、Rでリロード。</p><button id="startBtn">クリックして開始</button></div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('game'),engine=new BABYLON.Engine(canvas,true),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.60,.76,.89,1);
const scoreEl=$('score'),hitsEl=$('hits'),ammoEl=$('ammo'),stateEl=$('state'),scopeEl=$('scope'),cross=$('cross'),zoomEl=$('zoom'),hitEl=$('hit'),msg=$('msg'),start=$('start'),reloadEl=$('reload'),reloadFill=reloadEl.firstElementChild;
let score=0,hits=0,ammo=5,maxAmmo=5,scoped=false,zoom=4,reloading=false,yaw=0,pitch=-.12,lastShot=0;const movers=[];
function mat(name,hex){const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(hex);m.specularColor=new BABYLON.Color3(.06,.06,.06);return m}
const M={road:mat('road','#3d4146'),walk:mat('walk','#a8aaab'),w1:mat('w1','#c8b79e'),w2:mat('w2','#9ba8b2'),w3:mat('w3','#b58f79'),dark:mat('dark','#252c34'),glass:mat('glass','#477389'),white:mat('white','#e7e4de'),red:mat('red','#b64037'),blue:mat('blue','#345f9b'),yellow:mat('yellow','#d8ad3d'),green:mat('green','#50785b'),skin:mat('skin','#d0a17f'),orange:mat('orange','#bd6c31')};
new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(.2,1,.15),scene).intensity=.85;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.35,-1,-.25),scene);sun.position=new BABYLON.Vector3(30,55,30);sun.intensity=.6;
const camera=new BABYLON.FreeCamera('camera',new BABYLON.Vector3(0,15.5,27),scene);camera.inputs.clear();camera.fov=.78;camera.minZ=.1;camera.maxZ=400;scene.activeCamera=camera;function cam(){camera.rotation.x=pitch;camera.rotation.y=yaw}cam();
const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:100,height:180},scene);ground.material=mat('ground','#6d745c');const road=BABYLON.MeshBuilder.CreateGround('road',{width:18,height:180},scene);road.position.y=.02;road.material=M.road;
for(const x of[-11.5,11.5]){const s=BABYLON.MeshBuilder.CreateBox('sidewalk',{width:5,height:.25,depth:180},scene);s.position.set(x,.125,0);s.material=M.walk}for(let z=-80;z<90;z+=9){const d=BABYLON.MeshBuilder.CreateBox('dash',{width:.25,height:.04,depth:4.4},scene);d.position.set(0,.05,z);d.material=M.white}
const BM=[M.w1,M.w2,M.w3];for(const side of[-1,1])for(let i=0;i<9;i++){const w=8+(i%3)*1.8,d=14+(i%2)*3,h=11+(i%4)*3.2,z=-72+i*19,x=side*(17+w*.5),b=BABYLON.MeshBuilder.CreateBox('building',{width:w,height:h,depth:d},scene);b.position.set(x,h/2,z);b.material=BM[(i+(side>0?1:0))%3];for(let f=1;f<Math.floor(h/3);f++)for(let c=-1;c<=1;c++){const win=BABYLON.MeshBuilder.CreateBox('window',{width:1.25,height:1.25,depth:.05},scene);win.position.set(x-side*(w/2+.03),1.6+f*2.8,z+c*3);win.rotation.y=Math.PI/2;win.material=M.glass}}
const ledge=BABYLON.MeshBuilder.CreateBox('ledge',{width:12,height:1,depth:1.1},scene);ledge.position.set(0,12.5,23.5);ledge.material=M.w2;for(const sx of[-8.8,8.8])for(let z=-72;z<80;z+=24){const p=BABYLON.MeshBuilder.CreateCylinder('lampPole',{diameter:.18,height:4.8},scene);p.position.set(sx,2.4,z);p.material=M.dark;const l=BABYLON.MeshBuilder.CreateBox('lamp',{width:.6,height:.25,depth:.35},scene);l.position.set(sx,4.7,z);l.material=M.white}
function target(mesh,type,points){mesh.metadata={targetType:type,points};return mesh}for(let i=0;i<16;i++){const side=i%2?-1:1,b=BABYLON.MeshBuilder.CreateBox('crate',{size:1.4},scene);b.position.set(side*(8.8+(i%3)*.8),.82,-66+i*8.8);b.material=i%3?M.w1:M.orange;target(b,'object',25)}for(let i=0;i<7;i++){const side=i%2?-1:1,s=BABYLON.MeshBuilder.CreateBox('sign',{width:1.8,height:1.2,depth:.15},scene);s.position.set(side*9.6,2.6,-55+i*18);s.material=[M.red,M.blue,M.yellow][i%3];target(s,'object',40);const p=BABYLON.MeshBuilder.CreateCylinder('signPole',{diameter:.1,height:2.2},scene);p.position.set(side*9.6,1.1,-55+i*18);p.material=M.dark}
function person(id,x,z,dir){const root=new BABYLON.TransformNode('person'+id,scene),body=BABYLON.MeshBuilder.CreateCylinder('body',{diameterTop:.55,diameterBottom:.7,height:1.25,tessellation:8},scene),head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:.55,segments:8},scene),ll=BABYLON.MeshBuilder.CreateBox('leg',{width:.22,height:.85,depth:.25},scene),lr=ll.clone('leg2');body.parent=head.parent=ll.parent=lr.parent=root;body.position.y=1.25;head.position.y=2.12;ll.position.set(-.18,.43,0);lr.position.set(.18,.43,0);body.material=[M.red,M.blue,M.green,M.yellow][id%4];head.material=M.skin;ll.material=lr.material=M.dark;root.position.set(x,.15,z);const parts=[body,head,ll,lr];parts.forEach(p=>target(p,'person',100));movers.push({kind:'person',root,parts,speed:2.1+(id%3)*.35,dir,t:id*.7,alive:true,respawn:0})}for(let i=0;i<12;i++){const side=i%2?-1:1;person(i,side*(10.4+(i%3)*.45),-70+i*12,i%4<2?1:-1)}
function car(id,x,z,dir){const root=new BABYLON.TransformNode('car'+id,scene),body=BABYLON.MeshBuilder.CreateBox('carBody',{width:2.2,height:.75,depth:4.2},scene),cab=BABYLON.MeshBuilder.CreateBox('carCabin',{width:1.75,height:.75,depth:1.9},scene);body.parent=cab.parent=root;body.position.y=.75;cab.position.set(0,1.35,-.15*dir);body.material=[M.red,M.blue,M.yellow,M.green][id%4];cab.material=M.glass;root.position.set(x,0,z);if(dir<0)root.rotation.y=Math.PI;const parts=[body,cab];parts.forEach(p=>target(p,'car',60));movers.push({kind:'car',root,parts,speed:5+(id%3)*1.1,dir,alive:true,respawn:0})}for(let i=0;i<7;i++){const dir=i%2? -1:1;car(i,dir>0?-3.5:3.5,-78+i*24,dir)}
function hud(){scoreEl.textContent=score;hitsEl.textContent=hits;ammoEl.textContent=`${ammo} / ${maxAmmo}`}hud();function message(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(message.t);message.t=setTimeout(()=>msg.style.opacity=0,500)}function setScope(v){scoped=v;scopeEl.style.display=v?'block':'none';cross.style.display=v?'none':'block';camera.fov=v?.78/zoom:.78;zoomEl.textContent=zoom.toFixed(1)+'x'}
function effect(p){const s=BABYLON.MeshBuilder.CreateSphere('fx',{diameter:.22,segments:6},scene),m=new BABYLON.StandardMaterial('fxm',scene);s.position.copyFrom(p);m.emissiveColor=new BABYLON.Color3(1,.7,.2);s.material=m;setTimeout(()=>{s.dispose();m.dispose()},140)}async function reload(){if(reloading||ammo===maxAmmo)return;reloading=true;stateEl.textContent='RELOADING';reloadEl.style.display='block';const st=performance.now(),dur=1100;await new Promise(ok=>{function f(n){const p=Math.min(1,(n-st)/dur);reloadFill.style.width=p*100+'%';p<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)});ammo=maxAmmo;reloading=false;reloadEl.style.display='none';reloadFill.style.width=0;stateEl.textContent='READY';hud()}
function down(mesh){const m=movers.find(v=>v.parts.includes(mesh));if(!m||!m.alive)return;m.alive=false;m.respawn=2.6;m.parts.forEach(p=>p.setEnabled(false))}function shoot(){if(document.pointerLockElement!==canvas||reloading)return;const now=performance.now();if(now-lastShot<320)return;if(ammo<=0){reload();return}lastShot=now;ammo--;hud();pitch-=scoped?.009:.016;cam();const pick=scene.pickWithRay(camera.getForwardRay(300),m=>m.metadata&&m.metadata.targetType);if(pick.hit){const mesh=pick.pickedMesh,type=mesh.metadata.targetType,dist=BABYLON.Vector3.Distance(camera.position,pick.pickedPoint);let pts=mesh.metadata.points+Math.floor(dist/25)*10+(type==='person'?40:type==='car'?15:0);score+=pts;hits++;hud();effect(pick.pickedPoint);hitEl.style.display='block';setTimeout(()=>hitEl.style.display='none',120);message('+'+pts);if(type==='person'||type==='car')down(mesh)}if(ammo<=0)setTimeout(reload,350)}
$('startBtn').onclick=()=>canvas.requestPointerLock();canvas.onclick=()=>{if(document.pointerLockElement!==canvas)canvas.requestPointerLock()};document.addEventListener('pointerlockchange',()=>{const on=document.pointerLockElement===canvas;start.style.display=on?'none':'flex';if(!on)setScope(false)});document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;const s=scoped?.00065*(4/zoom):.00165;yaw-=e.movementX*s;pitch-=e.movementY*s;pitch=Math.max(-.95,Math.min(.62,pitch));cam()});document.addEventListener('mousedown',e=>{if(e.button===0)shoot();if(e.button===2)setScope(true)});document.addEventListener('mouseup',e=>{if(e.button===2)setScope(false)});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('wheel',e=>{if(document.pointerLockElement!==canvas)return;zoom=Math.max(2,Math.min(8,zoom+(e.deltaY<0?.5:-.5)));zoomEl.textContent=zoom.toFixed(1)+'x';if(scoped)camera.fov=.78/zoom;e.preventDefault()},{passive:false});document.addEventListener('keydown',e=>{if(e.code==='KeyR')reload()});
let last=performance.now();scene.onBeforeRenderObservable.add(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;for(const m of movers){if(!m.alive){m.respawn-=dt;if(m.respawn<=0){m.alive=true;m.parts.forEach(p=>p.setEnabled(true));m.root.position.z=m.dir>0?-82:82}continue}m.root.position.z+=m.speed*m.dir*dt;if(m.root.position.z>86)m.root.position.z=-86;if(m.root.position.z<-86)m.root.position.z=86;if(m.kind==='person'){m.t+=dt*7;m.parts[2].rotation.x=Math.sin(m.t)*.45;m.parts[3].rotation.x=-Math.sin(m.t)*.45}}});scene.fogMode=BABYLON.Scene.FOGMODE_LINEAR;scene.fogStart=100;scene.fogEnd=190;scene.fogColor=new BABYLON.Color3(.60,.76,.89);engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());
})();
</script>
</body>
</html>
